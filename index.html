<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>午夜留言</title>
  <meta name="description" content="一个专为手机设计的恐怖互动整蛊页面。">
  <link rel="preload" as="image" href="figure.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23000'/%3E%3Ccircle cx='22' cy='29' r='5' fill='%23fff'/%3E%3Ccircle cx='42' cy='29' r='5' fill='%23fff'/%3E%3Cpath d='M21 46Q32 36 43 46' fill='none' stroke='%23b91c1c' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--pale:#d8d4ca}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--pale);touch-action:manipulation}button{font:inherit}.screen{position:fixed;inset:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));background:#000;transition:opacity .7s}.noise{position:fixed;inset:-50%;pointer-events:none;opacity:.075;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}.start{text-align:center;width:min(100%,420px)}.eyebrow{font-size:.78rem;letter-spacing:.28em;color:#575757;text-transform:uppercase}.start h1{font:400 clamp(2.1rem,10vw,3.5rem)/1.15 Georgia,serif;letter-spacing:.08em;margin:22px 0 12px}.start p{font-size:.9rem;color:#6c6c6c;margin:0 0 44px}.play{width:92px;height:92px;border-radius:50%;border:1px solid #443838;background:radial-gradient(circle,#171111,#050505 67%);color:#ddd;position:relative;box-shadow:0 0 0 10px #ffffff03,0 0 65px #5007;cursor:pointer;animation:breathe 2.6s infinite}.play:before{content:"";display:block;margin:auto;width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:18px solid #bbb;transform:translateX(3px)}.hint{display:block;margin-top:20px;font-size:.74rem;color:#444;letter-spacing:.16em}
    #story{display:none;background:radial-gradient(circle at center,#101010 0,#020202 55%,#000 80%)}#story.active{display:grid}.clock{position:absolute;top:max(30px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#484848;font-size:.78rem;letter-spacing:.2em}.pulse{width:112px;height:112px;border:1px solid #392222;border-radius:50%;display:grid;place-items:center;position:relative}.pulse:before,.pulse:after{content:"";position:absolute;inset:0;border:1px solid #4e1717;border-radius:50%;animation:ring 2.4s infinite}.pulse:after{animation-delay:1.2s}.wave{display:flex;gap:5px;height:42px;align-items:center}.wave i{width:3px;height:12px;background:#7f1d1d;border-radius:4px;animation:wave .7s ease-in-out infinite alternate}.wave i:nth-child(2){animation-delay:.2s;height:28px}.wave i:nth-child(3){animation-delay:.4s;height:38px}.wave i:nth-child(4){animation-delay:.1s;height:22px}.wave i:nth-child(5){animation-delay:.3s;height:31px}.caption{position:absolute;bottom:14vh;left:24px;right:24px;text-align:center;font:400 clamp(1.35rem,6vw,2rem)/1.45 Georgia,serif;letter-spacing:.12em;min-height:3em;text-shadow:0 0 18px #000}
    #scare{display:none;padding:0;background:#000;z-index:5}#scare.active{display:block;animation:slam .13s ease-out}.face{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:50% 45%;filter:contrast(1.25) brightness(.75) saturate(.75)}.scareWord{position:absolute;bottom:7vh;left:0;right:0;text-align:center;font:900 clamp(2.5rem,15vw,6rem)/1 sans-serif;color:#e6e1da;letter-spacing:.1em;text-shadow:0 0 9px #000,0 0 25px #600}#reveal{display:none;z-index:8;text-align:center;background:#050505}#reveal.active{display:grid}.revealBox{width:min(100%,430px)}.revealBox h2{font:400 clamp(2rem,10vw,3.4rem)/1.2 Georgia,serif;margin:0 0 18px;color:#ded8cc}.revealBox p{font-size:.92rem;color:#777;margin:0 auto 34px;max-width:290px;line-height:1.7}.again{border:1px solid #4b1b1b;border-radius:2px;color:#c5bdb2;background:#150808;padding:15px 28px;min-width:180px;cursor:pointer}.safety{display:block;color:#373737;font-size:.66rem;margin-top:26px}
    @keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 0 17px #ffffff02,0 0 85px #7009}}@keyframes ring{to{transform:scale(2.1);opacity:0}}@keyframes wave{to{height:8px;opacity:.25}}@keyframes grain{0%{transform:translate(1%,2%)}50%{transform:translate(-2%,-1%)}100%{transform:translate(2%,-2%)}}@keyframes slam{0%{transform:scale(1.45);filter:brightness(2)}100%{transform:scale(1)}}@media(min-width:700px){body:before{content:"请用手机打开体验更佳";position:fixed;z-index:20;right:18px;bottom:16px;color:#555;font-size:.75rem}}@media(prefers-reduced-motion:reduce){.noise,.play,.pulse:before,.pulse:after,.wave i{animation:none}}
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main>
    <section class="screen" id="startScreen"><div class="start"><div class="eyebrow">Unknown · 00:17</div><h1>午夜留言</h1><p>一条未保存号码发来的语音</p><button class="play" id="play" aria-label="播放语音留言"></button><span class="hint">戴上耳机 · 点击播放</span></div></section>
    <section class="screen" id="story" aria-live="polite"><div class="clock" id="clock">00:00 / 00:12</div><div class="pulse"><div class="wave"><i></i><i></i><i></i><i></i><i></i></div></div><div class="caption" id="caption">……</div></section>
    <section class="screen" id="scare" aria-hidden="true"><img class="face" src="figure.png" alt="突然出现的恐怖幽灵面孔"><div class="scareWord">别回头</div></section>
    <section class="screen" id="reveal"><div class="revealBox"><h2>你被整蛊了</h2><p>放心，这只是一个恐怖网页。没有读取摄像头、麦克风或任何个人信息。</p><button class="again" id="again">再吓一次</button><span class="safety">纯属娱乐 · 无频闪 · 无数据收集</span></div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s),start=$('#startScreen'),story=$('#story'),scare=$('#scare'),reveal=$('#reveal'),caption=$('#caption'),clock=$('#clock');let audio,timers=[];
    function tone(freq,at,dur,vol=.025,type='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.04);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(audio.destination);o.start(at);o.stop(at+dur+.02)}
    function ambience(){audio=new(window.AudioContext||window.webkitAudioContext)();const n=audio.createBufferSource(),b=audio.createBuffer(1,audio.sampleRate*14,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.12;n.buffer=b;const f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=180;g.gain.value=.2;n.connect(f).connect(g).connect(audio.destination);n.start();tone(54,audio.currentTime,12,.035,'sawtooth');tone(48,audio.currentTime+5,7,.025,'sine')}
    function later(fn,ms){timers.push(setTimeout(fn,ms))}function begin(){ambience();start.style.opacity='0';later(()=>{start.style.display='none';story.classList.add('active')},650);[[1100,'你……听得到吗？'],[3900,'我找不到门了。'],[6600,'有人一直站在我后面。'],[9000,'它说……'],[10700,'现在轮到你了。']].forEach(([t,text])=>later(()=>{caption.textContent=text;if(navigator.vibrate)navigator.vibrate(text.length>8?[35,60,35]:25)},t));let s=0;const tick=setInterval(()=>{s++;clock.textContent=`00:${String(Math.min(s,12)).padStart(2,'0')} / 00:12`;if(s>=12)clearInterval(tick)},1000);later(jump,12300)}
    function jump(){story.classList.remove('active');scare.classList.add('active');scare.setAttribute('aria-hidden','false');if(navigator.vibrate)navigator.vibrate([120,40,180]);const now=audio.currentTime;for(let i=0;i<7;i++)tone(1800-i*190,now+i*.018,.38,.07,'sawtooth');later(()=>{scare.style.opacity='0'},2350);later(()=>{scare.classList.remove('active');reveal.classList.add('active')},3000)}$('#play').addEventListener('click',begin,{once:true});$('#again').addEventListener('click',()=>location.reload());
  </script>
</body>
</html>
