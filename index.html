    <section class="screen" id="reveal"><div class="revealBox"><h2>你被整蛊了</h2><p>放心，这只是一个恐怖网页。没有读取摄像头、麦克风或任何个人信息。</p><button class="again" id="again">再吓一次</button><span class="safety">纯属娱乐 · 无频闪 · 无数据收集</span></div></section>

  <script>
    const $=s=>document.querySelector(s),start=$('#startScreen'),story=$('#story'),scare=$('#scare'),reveal=$('#reveal'),caption=$('#caption'),clock=$('#clock');let audio,timers=[];
    function tone(freq,at,dur,vol=.025,type='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.04);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(audio.destination);o.start(at);o.stop(at+dur+.02)}
    function ambience(){audio=new(window.AudioContext||window.webkitAudioContext)();const n=audio.createBufferSource(),b=audio.createBuffer(1,audio.sampleRate*14,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.12;n.buffer=b;const f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=180;g.gain.value=.2;n.connect(f).connect(g).connect(audio.destination);n.start();tone(54,audio.currentTime,12,.035,'sawtooth');tone(48,audio.currentTime+5,7,.025,'sine')}
    function later(fn,ms){timers.push(setTimeout(fn,ms))}function begin(){ambience();start.style.opacity='0';later(()=>{start.style.display='none';story.classList.add('active')},650);[[1100,'你……听得到吗？'],[3900,'我找不到门了。'],[6600,'有人一直站在我后面。'],[9000,'它说……'],[10700,'现在轮到你了。']].forEach(([t,text])=>later(()=>{caption.textContent=text;if(navigator.vibrate)navigator.vibrate(text.length>8?[35,60,35]:25)},t));let s=0;const tick=setInterval(()=>{s++;clock.textContent=`00:${String(Math.min(s,12)).padStart(2,'0')} / 00:12`;if(s>=12)clearInterval(tick)},1000);later(jump,12300)}
    function jump(){story.classList.remove('active');scare.classList.add('active');scare.setAttribute('aria-hidden','false');if(navigator.vibrate)navigator.vibrate([120,40,180]);const now=audio.currentTime;for(let i=0;i<7;i++)tone(1800-i*190,now+i*.018,.38,.07,'sawtooth');later(()=>{scare.style.opacity='0'},2350);later(()=>{scare.classList.remove('active');reveal.classList.add('active')},3000)}$('#play').addEventListener('click',begin,{once:true});$('#again').addEventListener('click',()=>location.reload());
